initial: __start__
start_route: choice

transitions:
  __start__:
    - to: prepare

  prepare:
    - to: outline
      when: >
        Generate, reuse, display, or revise an authoring outline. Choose this route
        for a supplied source only when the user explicitly identifies that source
        as an outline to use or revise.
    - to: write_document
      when: >
        Revise or fully rewrite an existing full document directly. This is the mandatory
        route when the user asks to add, delete, replace, or rewrite sections or paragraphs,
        condense the whole document, change its chapter count, or merge or reorder chapters
        in a supplied article, report, or other complete document. References to headings,
        section numbers, or insertion positions do not make the source an outline.
    - to: __end__
      when: The requested read-only preparation is complete.

  outline:
    - to: write_document
      when: Draft the full document from the latest outline revision.
    - to: __end__
      when: The requested outline work is complete.

  write_document:
    - to: __end__

steps:
  prepare:
    label: 写作准备
    mode: auto
    route: choice
    prompt: |
      {{runtime_instruction}}

      Prepare the workspace only; do not generate an outline or body.

      Select one writer_prepare_workspace operation:
      - create: start from scratch.
      - use_outline: use or revise a supplied outline.
      - rewrite_document: rewrite or restructure a supplied complete document.
      - revise_document: make targeted changes to a supplied complete document.
      - prepare_only: prepare a supplied source without continuing to writing.

      If a Feishu/Lark source is referenced but {{user_input}} has no exact URL, stop and
      report the missing locator. If a knowledge base is explicitly requested, query it
      once and pass the evidence as knowledge_text; otherwise skip KB.

      Call writer_prepare_workspace exactly once with the complete user_input, operation,
      source_filename when supplied, and knowledge_text when retrieved. In one
      save_artifacts call, save writing_task, media_assets, resource_profiles, and
      writing_context; also save source_document and target_document only when returned.
      Save every returned path as content_type="file". Do not invent fallback artifacts.

      Report representation and the exact `REQUIRED_NEXT_STEP: <next_step>` returned.
      If source_document is absent, state that processing continues directly to outline.
    tools:
      - kb
      - writer_prepare_workspace
    outputs:
      - material: writing_task
      - material: media_assets
      - material: resource_profiles
      - material: writing_context
      - material: source_document
        required: false
      - material: target_document
        required: false
    acceptance_criteria: |
      writing_task, media_assets, resource_profiles, and writing_context are present.
      media_assets is valid even when its assets mapping is empty.
      When a Feishu/Lark source was required, source_document and target_document are also present.

  outline:
    label: 大纲
    route: choice
    rerun_when: >
      The user asks to modify, regenerate, or replace the current outline artifact.
    prompt: |
      {{runtime_instruction}}

      Retrieve artifact paths only: writing_task, writing_context, optional source_document,
      and the latest outline_document and writing_context_after_outline. Use the latter
      context when present.

      Select one writer_outline_workspace operation:
      - use_source: no outline exists and source_document is the supplied outline.
      - generate: no outline/source exists, or complete regeneration is requested.
      - revise: an outline exists and a targeted change is requested.

      Call writer_outline_workspace exactly once. Pass writing_task_path for generate,
      source_document_path for use_source, or user_input plus outline_document_path for
      revise. Do not call internal tools.

      In one save_artifacts call, save outline_document and
      writing_context_after_outline, plus every returned revision path under its matching
      key. Save paths as content_type="file" and do not reread the result for a summary.
    tools:
      - writer_outline_workspace
    inputs:
      - material: writing_task
        required: true
      - material: writing_context
        required: true
      - material: source_document
        required: false
      - material: resource_profiles
        required: false
    outputs:
      - material: outline_document
      - material: writing_context_after_outline
      - material: outline_revision_task
        required: false
      - material: outline_locate_result
        required: false
      - material: outline_modify_plan
        required: false
      - material: outline_revision_set
        required: false
      - material: outline_revision_result
        required: false
      - material: outline_write_result
        required: false
    acceptance_criteria: |
      outline_document and writing_context_after_outline are present. Markdown outlines
      are `.md`; IR outlines have stage="outline" and ui_editable=true. Revision internals are required only when
      this execution handled an AI revision. For a cloud-bound revision,
      outline_write_result must report success.

  write_document:
    label: 成稿
    rerun_when: >
      The user asks to modify or rewrite the current draft_document, including changes
      to text, structure, images, tables, references, formatting, or insertion position.
    prompt: |
      {{runtime_instruction}}

      Retrieve available artifact paths: latest draft_document, source_document,
      target_document, outline_document, writing_task, media_assets, writing_context,
      writing_context_after_outline, and writing_context_after_draft.

      Select exactly one operation for writer_draft_workspace:
      - generate: create/regenerate from outline when no draft exists or regeneration is requested.
      - rewrite: restructure the complete latest draft/source.
      - revise: make a targeted text or image change to the latest draft/source.

      Call writer_draft_workspace exactly once with all matching artifact paths. Use context
      priority: writing_context_after_draft, writing_context_after_outline, writing_context.
      For revise, pass the complete user_input. Do not call internal tools. The workspace
      saves every output artifact itself and returns completion metadata. After it reports
      artifacts_saved=true, do not call save_artifacts, get_artifact, list_artifacts, or
      reread any output; finish immediately from the returned completion metadata.
    tools:
      - writer_draft_workspace
    inputs:
      - material: outline_document
        required: true
        alternatives:
          - material: source_document
      - material: writing_task
        required: true
      - material: media_assets
        required: true
      - material: writing_context_after_outline
        required: true
        alternatives:
          - material: writing_context
      - material: source_document
        required: false
      - material: target_document
        required: false
    outputs:
      - material: draft_document
      - material: writing_context_after_draft
      - material: section_instructions
        required: false
      - material: visual_plan
        required: false
      - material: resolved_media_assets
        required: false
      - material: draft_blocks
        required: false
      - material: document_revision_task
        required: false
      - material: document_locate_result
        required: false
      - material: document_modify_plan
        required: false
      - material: document_revision_set
        required: false
      - material: document_revision_result
        required: false
      - material: document_write_result
        required: false
    acceptance_criteria: |
      draft_document and writing_context_after_draft are present. Markdown output is a
      `.md` file or an IR document with ui_editable=true. Drafting artifacts are required
      for generation/rewrite mode; IR generation also requires visual_plan and
      resolved_media_assets. A targeted revision requires document_revision_task,
      document_locate_result, document_modify_plan, document_revision_set, and a successful
      document_revision_result. A targeted image-adding revision also requires resolved_media_assets.
      When generation started without draft_document and used a cloud-bound `.lmd` source,
      document_write_result must report success and draft_document must be the
      provider-confirmed document. Every cloud-bound IR full-document rewrite also requires
      one successful document_write_result and a provider-confirmed draft_document,
      regardless of whether a previous draft existed. Markdown rewrite remains local and
      does not require document_write_result. Later targeted revisions must not mutate the
      cloud document automatically.
